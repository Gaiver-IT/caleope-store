services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.5
    container_name: music-assistant
    restart: unless-stopped
    env_file:
      - {{.BaseDir}}/app-config/{{.AppID}}/secrets.env
    volumes:
      - {{.BaseDir}}/app-data/{{.AppID}}/data:/data
    logging:
      options:
        max-size: "50m"
        max-file: "4"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.music-assistant.rule=Host(`{{.Domain}}`)"
      - "traefik.http.routers.music-assistant.entrypoints=websecure"
      - "traefik.http.routers.music-assistant.tls=true"
      - "traefik.http.routers.music-assistant.middlewares=${CALEOPE_AUTH_MIDDLEWARE}"
      - "traefik.http.services.music-assistant.loadbalancer.server.port=8095"
      - "traefik.docker.network=caleope-public"
    networks:
      - caleope-public

networks:
  caleope-public:
    external: true
