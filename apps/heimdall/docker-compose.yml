services:
  heimdall:
    # ⚠️ Projet quasi figé : 2.8.1 est la dernière version publiée et le dépôt
    # ne bouge plus guère. C'est un choix assumé (Heimdall fait une seule chose),
    # mais il ne faut pas en attendre de nouvelles fonctionnalités.
    image: linuxserver/heimdall:2.8.1
    container_name: heimdall
    restart: unless-stopped
    env_file:
      - ${CALEOPE_BASE_DIR}/app-config/heimdall/secrets.env
    ports:
      - "${CALEOPE_PORT_WEB}:80"
    volumes:
      - ${CALEOPE_BASE_DIR}/app-data/heimdall/config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heimdall.rule=Host(`${CALEOPE_DOMAIN}`)"
      - "traefik.http.routers.heimdall.entrypoints=websecure"
      - "traefik.http.routers.heimdall.tls=true"
      - "traefik.http.services.heimdall.loadbalancer.server.port=80"
      - "traefik.docker.network=caleope-public"
    networks:
      - caleope-public
      - caleope-internal

networks:
  caleope-public:
    external: true
  caleope-internal:
    external: true
