services:
  gitea-db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    env_file:
      - app.env
      - {{.BaseDir}}/app-config/{{.AppID}}/secrets.env
    volumes:
      - {{.BaseDir}}/app-data/gitea/db:/var/lib/postgresql/data
    networks:
      - caleope-internal

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    depends_on:
      - gitea-db
    env_file:
      - app.env
      - {{.BaseDir}}/app-config/{{.AppID}}/secrets.env
    volumes:
      - {{.BaseDir}}/app-data/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${CALEOPE_PORT_WEB}:3000"
      # ⚠️ Le port SSH était déclaré dans app.json (host 2222, firewall: true),
      # le paquet configure GITEA__server__SSH_PORT=2222 et les notes
      # d'installation invitent à cloner en « ssh://git@…:2222 » — mais rien ne
      # publiait ce port. Le git-par-SSH ne pouvait donc PAS fonctionner : la
      # connexion tombait sur un port fermé. Constaté au banc le 13/08/2026 en
      # cherchant des ports déclarés que le compose n'ouvre jamais.
      - "${CALEOPE_PORT_SSH}:22"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`{{.Domain}}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.docker.network=caleope-public"
    networks:
      - caleope-public
      - caleope-internal

  gitea-bootstrap:
    image: gitea/gitea:latest
    container_name: gitea-bootstrap
    user: "git"
    restart: "no"
    depends_on:
      - gitea
    env_file:
      - {{.BaseDir}}/app-config/{{.AppID}}/secrets.env
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - {{.BaseDir}}/app-data/gitea/data:/data
      - {{.BaseDir}}/app-config/{{.AppID}}/bootstrap.sh:/bootstrap.sh:ro
    networks:
      - caleope-internal

networks:
  caleope-public:
    external: true
  caleope-internal:
    external: true
