services:
  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    env_file:
      - ${CALEOPE_BASE_DIR}/app-config/hermes/secrets.env
    ports:
      - "${CALEOPE_PORT_WEB}:8080"
    volumes:
      - ${CALEOPE_BASE_DIR}/app-data/hermes/data:/root/.hermes
      - ${CALEOPE_BASE_DIR}/app-data/hermes/ssh:/root/.ssh
      - ${CALEOPE_BASE_DIR}/app-data/hermes/workspace:/workspace
    working_dir: /workspace
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hermes.rule=Host(`${CALEOPE_DOMAIN}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.services.hermes.loadbalancer.server.port=8080"
      - "traefik.docker.network=caleope-public"
    networks:
      - caleope-public
      - caleope-internal

networks:
  caleope-public:
    external: true
  caleope-internal:
    external: true