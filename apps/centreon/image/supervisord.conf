[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[unix_http_server]
file=/run/supervisor.sock
; gorgone (compte centreon-gorgone) doit pouvoir piloter les services : c'est LUI
; qui relance le moteur quand l'utilisateur applique une configuration. Sans ces
; droits, la prise reste en root, l'appel échoue en silence, et Centreon annonce
; quand même « signal de rechargement envoyé ». Constaté le 12/08/2026.
chmod=0770
chown=root:centreon-gorgone

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Le web d'abord : c'est lui qui porte le formulaire d'installation.
[program:php-fpm]
command=/usr/sbin/php-fpm8.2 --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:apache2]
command=/usr/sbin/apache2ctl -DFOREGROUND
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# Les moteurs ne démarrent QU'APRÈS l'installation : sans configuration générée,
# centengine sort en erreur et supervisor le relancerait en boucle.
[program:gorgoned]
; On vise config.yaml et pas 40-gorgoned.yaml : le premier est le point d'entrée
; prévu par le paquet (il fait « !include config.d/*.yaml »), le second est un
; fichier ENGENDRÉ à l'installation. Viser directement le fichier engendré rend
; le démarrage dépendant de sa présence — et gorgone tombait en FATAL après
; chaque redémarrage tant que /etc/centreon-gorgone n'était pas persisté.
command=/usr/bin/perl /usr/bin/gorgoned --config=/etc/centreon-gorgone/config.yaml --logfile=/dev/stdout --severity=info
priority=40
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:cbd]
command=/usr/sbin/cbd /etc/centreon-broker/central-broker.json
priority=50
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:centengine]
command=/usr/sbin/centengine /etc/centreon-engine/centengine.cfg
priority=60
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# Recharge le moteur quand la configuration change : dans un conteneur, le signal
# de rechargement de Centreon n'arrive jamais (voir le script pour le détail).
[program:reload-watch]
command=/usr/local/bin/centreon-reload-watch
priority=70
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
