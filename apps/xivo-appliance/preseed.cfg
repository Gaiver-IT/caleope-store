# =============================================================================
# Preseed Debian 11 (Bullseye) — Appliance XiVO PBX pour Caleope
# Installe Debian minimale, puis un service first-boot lance le xivo_install.sh
# OFFICIEL (miroir XiVO). Auto-suffisant : le firstboot + le service systemd
# sont embarqués (base64) dans late_command, rien d'externe à héberger.
# =============================================================================

### Localisation
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

### Réseau (DHCP)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string xivo
d-i netcfg/get_domain string local
d-i netcfg/hostname string xivo
d-i netcfg/dhcp_timeout string 60

### Miroir Debian (officiel)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bullseye

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Comptes — root activé (mdp par défaut, À CHANGER au 1er accès)
d-i passwd/root-login boolean true
d-i passwd/root-password password xivo-changeme
d-i passwd/root-password-again password xivo-changeme
d-i passwd/make-user boolean false

### Partitionnement — disque entier, une partition, ext4
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/vda
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base system — minimal + SSH
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string wget ca-certificates gnupg sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Fin — reboot auto
d-i finish-install/reboot_in_progress note

### late_command : déposer le first-boot XiVO (embarqué) + activer le service.
d-i preseed/late_command string \
  in-target mkdir -p /opt/xivo-appliance ; \
  in-target sh -c 'echo  | base64 -d > /opt/xivo-appliance/xivo-firstboot.sh' ; \
  in-target sh -c 'echo  | base64 -d > /etc/systemd/system/xivo-firstboot.service' ; \
  in-target chmod +x /opt/xivo-appliance/xivo-firstboot.sh ; \
  in-target systemctl enable xivo-firstboot.service
