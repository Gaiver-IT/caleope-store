services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    env_file:
      - {{.BaseDir}}/app-config/{{.AppID}}/secrets.env
    volumes:
      - {{.BaseDir}}/app-config/{{.AppID}}/searxng:/etc/searxng
    ports:
      - "${CALEOPE_PORT_WEB}:8080"
    depends_on:
      - searxng-redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`{{.Domain}}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
      - "traefik.docker.network=caleope-public"
    networks:
      - caleope-public
      - caleope-internal

  searxng-redis:
    image: valkey/valkey:8-alpine
    container_name: searxng-redis
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - {{.BaseDir}}/app-data/{{.AppID}}/valkey:/data
    networks:
      - caleope-internal

networks:
  caleope-public:
    external: true
  caleope-internal:
    external: true
